[build]
  command = "echo 'Static site - no build required'"
  publish = "."

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  command = "echo 'Production build'"

[headers]
  [[headers.values]]
    key = "Cache-Control"
    value = "public, max-age=3600"

  [[headers.values]]
    key = "X-Content-Type-Options"
    value = "nosniff"

  [[headers.values]]
    key = "X-Frame-Options"
    value = "SAMEORIGIN"

  [[headers.values]]
    key = "X-XSS-Protection"
    value = "1; mode=block"
